name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  # Re-run weekly so that a change in Vim itself (a new return value, a
  # renamed event, ...) is reported even when the plugin has not changed.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Vim ${{ matrix.vim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only Vim 9.1 and newer is supported.  The oldest entry is the lower
        # bound; master catches upcoming Vim changes early.
        vim: [ 'v9.1.0000', 'v9.1.1000', 'v9.1.2000', 'master' ]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git gettext libncurses-dev

      - name: Build Vim ${{ matrix.vim }}
        run: |
          git clone --depth 1 --branch "${{ matrix.vim }}" \
            https://github.com/vim/vim.git /tmp/vim
          cd /tmp/vim
          ./configure --with-features=huge \
            --enable-multibyte \
            --enable-terminal \
            --disable-gui \
            --without-x
          make -j"$(nproc)"
          sudo make install

      - name: Show Vim version
        run: vim --version | head -5

      # The API contract test runs first: it pins the Vim built-ins, events and
      # options the plugin relies on, so a Vim change is reported right here.
      - name: API contract tests
        run: make api

      - name: Lint (load the plugin)
        run: make lint

      - name: Package conformance
        run: make conformance

      - name: Test suite
        run: make test-vim

      - name: PTY checks
        run: make pty

      - name: Benchmarks (informational)
        run: make bench
